name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build tests
        run: cargo build --tests --verbose

      - name: Run tests
        run: cargo test

      - name: Set Cargo.toml version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid semver — refusing to set version"
            exit 1
          fi
          echo "Setting version to $VERSION"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="sway-tab-${VERSION}-x86_64-linux"
          cp target/release/sway-tab "$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
